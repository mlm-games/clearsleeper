name: Diag

on:
  push:
    branches: [master]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev pkg-config libx11-dev libxcb1-dev libxi-dev libxinerama-dev libxrandr-dev libxcursor-dev libfontconfig-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Report failures
        if: failure()
        run: |
          grep -E "^test .*FAILED$|^---- .* stdout ----$" "$RUNNER_TEMP/test.log" | sed 's/^/::error::/' | head -60
