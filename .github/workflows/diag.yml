name: Diag

on:
  push:
    branches: [master]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev libudev-dev pkg-config libx11-dev libxcb1-dev libxi-dev libxinerama-dev libxrandr-dev libxcursor-dev libfontconfig-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast -- --test-threads=4 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Report failures
        if: failure()
        run: |
          awk '
            /^---- .* stdout ----$/ { block = $0; n = 0; next }
            block != "" && n < 8 { print "::error::" block " " $0; n++; next }
            block != "" && n >= 8 { block = ""; n = 0 }
          ' "$RUNNER_TEMP/test.log" | head -80
