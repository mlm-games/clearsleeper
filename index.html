<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="ClearSleeper" />
  <meta name="theme-color" content="#86AD81" />
  <title>ClearSleeper</title>

  <link data-trunk rel="rust" data-target-name="clearsleeper" />

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #86AD81;
    }
    canvas {
      outline: none;
      touch-action: none;
      width: 100%;
      height: 100%;
      display: block;
    }
    #disc-drop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #86AD81;
      font: 16px/1.5 system-ui, sans-serif;
      color: #10231b;
    }
    #disc-drop.drag #disc-card {
      border-color: #10231b;
    }
    #disc-card {
      max-width: 30rem;
      padding: 1.5rem 1.75rem;
      border: 2px dashed rgba(16, 35, 27, 0.45);
      border-radius: 0.75rem;
      background: rgba(255, 255, 255, 0.35);
      text-align: center;
    }
    #disc-card h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
    }
    #disc-card p {
      margin: 0.5rem 0 0;
    }
    #disc-pick {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      background: #10231b;
      color: #f4fff9;
      cursor: pointer;
    }
    #disc-pick input {
      display: none;
    }
    #disc-note {
      opacity: 0.7;
      font-size: 0.85rem;
    }
    #disc-status {
      min-height: 1.5rem;
      font-weight: 600;
    }
    #disc-status[data-kind="error"] {
      color: #7a1414;
    }
  </style>
</head>

<body>
  <div id="disc-drop">
    <div id="disc-card">
      <h1>ClearSleeper</h1>
      <p id="disc-hint">Drop a GameCube disc image to play: an ISO/GCM dump or an RVZ.</p>
      <label id="disc-pick">Choose a file<input id="disc-file" type="file" accept=".iso,.gcm,.rvz" /></label>
      <p id="disc-status" role="status"></p>
      <p id="disc-note">The image is read in this tab and kept in this browser for next time.
        Nothing is uploaded. Clear this site's data to choose a different image.</p>
    </div>
  </div>

  <script type="module">
    const drop = document.getElementById("disc-drop");
    const status = document.getElementById("disc-status");
    const file = document.getElementById("disc-file");

    const say = (text, kind = "") => {
      status.textContent = text;
      if (kind) {
        status.dataset.kind = kind;
      } else {
        delete status.dataset.kind;
      }
    };

    // Trunk's glue sets `window.wasmBindings` and then fires this event, so either order works.
    const bindingsReady = () => new Promise((resolve) => {
      if (window.wasmBindings) {
        resolve(window.wasmBindings);
        return;
      }
      addEventListener("TrunkApplicationStarted", () => resolve(window.wasmBindings), { once: true });
    });

    // A dropped image is kept here so a reload does not ask for the disc again. IndexedDB stores
    // the File as a browser-managed blob, not a copy in the page's heap; the image is still read
    // only by this origin and is never uploaded.
    const DB_NAME = "clearsleeper";
    const STORE = "disc";
    const KEY = "image";

    function openDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = () => {
          if (!request.result.objectStoreNames.contains(STORE)) {
            request.result.createObjectStore(STORE);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function readCached() {
      const db = await openDb();
      try {
        return await new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readonly");
          const request = tx.objectStore(STORE).get(KEY);
          request.onsuccess = () => resolve(request.result ?? null);
          request.onerror = () => reject(request.error);
        });
      } finally {
        db.close();
      }
    }

    async function writeCached(blob) {
      const db = await openDb();
      try {
        await new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readwrite");
          tx.objectStore(STORE).put(blob, KEY);
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
          tx.onabort = () => reject(tx.error);
        });
      } finally {
        db.close();
      }
    }

    async function clearCached() {
      const db = await openDb();
      try {
        await new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readwrite");
          tx.objectStore(STORE).delete(KEY);
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
      } finally {
        db.close();
      }
    }

    const imageLimit = (bindings) =>
      typeof bindings.discImageLimit === "function" ? bindings.discImageLimit() : Infinity;

    const megabytes = (bytes) => (bytes / 1048576).toFixed(0);

    let installing = false;
    let booted = false;

    // The Rust side reports a panic here before the wasm build aborts, so the status line keeps
    // the reason a bare trap would hide.
    let panicReport = "";
    window.__clearsleeperPanic = (text) => {
      panicReport = text;
      say(text, "error");
    };

    async function startImage(bytes, label) {
      const bindings = await bindingsReady();
      say(`Checking ${label}…`);
      let summary;
      panicReport = "";
      try {
        summary = bindings.installDiscImage(bytes);
      } catch (error) {
        // The Rust side answers with the typed failure for this image.
        say(panicReport || `${error}`, "error");
        return false;
      }
      say(`Starting ClearSleeper on ${summary}…`);
      panicReport = "";
      try {
        bindings.boot();
      } catch (error) {
        say(`ClearSleeper failed to start: ${panicReport || error}`, "error");
        return false;
      }
      booted = true;
      drop.remove();
      return true;
    }

    async function keepForNextVisit(picked) {
      try {
        if (navigator.storage && navigator.storage.persist) {
          await navigator.storage.persist();
        }
        await writeCached(picked);
      } catch (error) {
        // A full disk or a browser without large IndexedDB blobs only costs the next upload.
        console.warn("ClearSleeper: could not keep the disc image for next time", error);
      }
    }

    async function install(picked) {
      if (installing || booted) {
        return;
      }
      installing = true;
      try {
        const bindings = await bindingsReady();
        const limit = imageLimit(bindings);
        if (picked.size > limit) {
          say(
            `${picked.name} is ${megabytes(picked.size)} MB; this build reads images up to ` +
              `${megabytes(limit)} MB`,
            "error",
          );
          return;
        }
        say(`Reading ${picked.name} (${megabytes(picked.size)} MB)…`);
        let bytes;
        try {
          bytes = new Uint8Array(await picked.arrayBuffer());
        } catch (error) {
          say(`Could not read ${picked.name}: ${error}`, "error");
          return;
        }
        if (await startImage(bytes, picked.name)) {
          keepForNextVisit(picked);
        }
      } finally {
        installing = false;
      }
    }

    async function restore() {
      if (installing || booted) {
        return;
      }
      installing = true;
      try {
        let cached;
        try {
          cached = await readCached();
        } catch (error) {
          console.warn("ClearSleeper: could not read the saved disc image", error);
          return;
        }
        if (!cached) {
          return;
        }
        const label = cached.name || "saved disc image";
        const bindings = await bindingsReady();
        const limit = imageLimit(bindings);
        if (cached.size > limit) {
          await clearCached();
          say(`${label} is ${megabytes(cached.size)} MB; choose a smaller image`, "error");
          return;
        }
        say(`Reading ${label} (${megabytes(cached.size)} MB)…`);
        let bytes;
        try {
          bytes = new Uint8Array(await cached.arrayBuffer());
        } catch (error) {
          await clearCached();
          say(`Could not read the saved image: ${error}. Choose the file again.`, "error");
          return;
        }
        if (!(await startImage(bytes, label))) {
          await clearCached();
          say("The saved disc image could not be used. Choose the file again.", "error");
        }
      } finally {
        if (!booted) {
          installing = false;
        }
      }
    }

    addEventListener("dragenter", (event) => {
      event.preventDefault();
      drop.classList.add("drag");
    });
    addEventListener("dragover", (event) => {
      event.preventDefault();
      drop.classList.add("drag");
    });
    addEventListener("dragleave", () => drop.classList.remove("drag"));
    addEventListener("drop", (event) => {
      event.preventDefault();
      drop.classList.remove("drag");
      const picked = event.dataTransfer?.files?.[0];
      if (picked) {
        install(picked);
      }
    });
    file.addEventListener("change", () => {
      const picked = file.files?.[0];
      if (picked) {
        install(picked);
      }
    });

    restore();
  </script>
</body>

</html>
