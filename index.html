<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="ClearSleeper" />
  <meta name="theme-color" content="#86AD81" />
  <title>ClearSleeper</title>

  <link data-trunk rel="rust" data-target-name="clearsleeper" />

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #86AD81;
    }
    canvas {
      outline: none;
      touch-action: none;
      width: 100%;
      height: 100%;
      display: block;
    }
    #cs-panic {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      padding: 1.5rem;
      overflow: auto;
      background: #1b0f0f;
      color: #ffd9d9;
      font: 14px/1.5 ui-monospace, monospace;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <input id="disc-file" type="file" accept=".iso,.gcm,.rvz" hidden />
  <div id="cs-panic"></div>

  <script type="module">
    const file = document.getElementById("disc-file");
    const hint = "Drop a GameCube disc image here, or choose Load Disc.";

    // js-sys's future queue drains tasks from a wasm-bindgen Closure via queueMicrotask.
    // A future that schedules another task while the queue is draining re-enters that same
    // Closure, which wasm-bindgen rejects with "closure invoked recursively or after being
    // dropped" (the stack seen at boot). A promise hop keeps nested scheduling on a later
    // tick, which is what js-sys's own fallback does when queueMicrotask is absent.
    globalThis.queueMicrotask = (fn) => {
      Promise.resolve().then(fn);
    };

    // wgpu 30's first boot future is WebGPU detection: it reads navigator.gpu and awaits
    // request_adapter. That future is the task that traps with "index out of bounds" here.
    // repose enables the GL backend alongside WebGPU, so hide the property to select WebGL.
    if (typeof Navigator !== "undefined") {
      const hideGpu = () => undefined;
      try {
        Object.defineProperty(Navigator.prototype, "gpu", {
          configurable: true,
          get: hideGpu,
        });
      } catch {
        Object.defineProperty(navigator, "gpu", {
          configurable: true,
          get: hideGpu,
        });
      }
    }

    // The start screen is native Rust; the page only reports progress to it.
    let statusText = "";
    const pushStatus = () => {
      const bindings = window.wasmBindings;
      if (bindings && typeof bindings.clearsleeperDiscStatus === "function") {
        bindings.clearsleeperDiscStatus(statusText);
      }
    };
    const say = (text, _kind = "") => {
      statusText = text;
      pushStatus();
    };

    // Called by the native start UI's Load Disc button.
    window.clearsleeperPickDisc = () => file.click();

    // Trunk's glue sets `window.wasmBindings` and then fires this event, so either order works.
    const bindingsReady = () => new Promise((resolve) => {
      const ready = (bindings) => {
        pushStatus();
        resolve(bindings);
      };
      if (window.wasmBindings) {
        ready(window.wasmBindings);
        return;
      }
      addEventListener("TrunkApplicationStarted", () => ready(window.wasmBindings), { once: true });
    });

    // A dropped image is kept here so a reload does not ask for the disc again. IndexedDB stores
    // the File as a browser-managed blob, not a copy in the page's heap; the image is still read
    // only by this origin and is never uploaded.
    const DB_NAME = "clearsleeper";
    const STORE = "disc";
    const KEY = "image";

    function openDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = () => {
          if (!request.result.objectStoreNames.contains(STORE)) {
            request.result.createObjectStore(STORE);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function readCached() {
      const db = await openDb();
      try {
        return await new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readonly");
          const request = tx.objectStore(STORE).get(KEY);
          request.onsuccess = () => resolve(request.result ?? null);
          request.onerror = () => reject(request.error);
        });
      } finally {
        db.close();
      }
    }

    async function writeCached(blob) {
      const db = await openDb();
      try {
        await new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readwrite");
          tx.objectStore(STORE).put(blob, KEY);
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
          tx.onabort = () => reject(tx.error);
        });
      } finally {
        db.close();
      }
    }

    async function clearCached() {
      const db = await openDb();
      try {
        await new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readwrite");
          tx.objectStore(STORE).delete(KEY);
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
      } finally {
        db.close();
      }
    }

    const imageLimit = (bindings) =>
      typeof bindings.discImageLimit === "function" ? bindings.discImageLimit() : Infinity;

    const megabytes = (bytes) => (bytes / 1048576).toFixed(0);

    let installing = false;
    let booted = false;
    let booting = false;
    const RELOAD_KEY = "cs-disc-reload";

    // The canvas starts with the native Rust start screen. A disc is then installed into a
    // fresh instance on reload, which is the construction path that loads the game's assets.
    async function startShell() {
      if (booted || booting) {
        return;
      }
      booting = true;
      const bindings = await bindingsReady();
      try {
        bindings.boot();
        booted = true;
      } catch (error) {
        say(`ClearSleeper failed to start: ${panicReport || error}`);
      } finally {
        booting = false;
      }
    }

    // The Rust side reports a panic here before the wasm build aborts. Keep it for the caller's
    // catch block to show: pushing it into wasm from inside a panicking wasm call would reenter
    // an instance that is about to abort.
    let panicReport = "";
    window.__clearsleeperPanic = (text) => {
      panicReport = text;
      console.error(text);
      const overlay = document.getElementById("cs-panic");
      overlay.textContent = `ClearSleeper stopped:\n${text}`;
      overlay.style.display = "block";
    };

    async function startImage(bytes, label) {
      const bindings = await bindingsReady();
      say(`Checking ${label}…`);
      let summary;
      panicReport = "";
      try {
        summary = bindings.installDiscImage(bytes);
      } catch (error) {
        // The Rust side answers with the typed failure for this image.
        say(panicReport || `${error}`);
        return false;
      }
      say(`Starting ClearSleeper on ${summary}…`);
      panicReport = "";
      return true;
    }

    async function keepForNextVisit(picked) {
      try {
        if (navigator.storage && navigator.storage.persist) {
          await navigator.storage.persist();
        }
        await writeCached(picked);
      } catch (error) {
        // A full disk or a browser without large IndexedDB blobs only costs the next upload.
        console.warn("ClearSleeper: could not keep the disc image for next time", error);
      }
    }

    async function install(picked) {
      if (installing || booted) {
        return;
      }
      installing = true;
      try {
        const bindings = await bindingsReady();
        const limit = imageLimit(bindings);
        if (picked.size > limit) {
          say(
            `${picked.name} is ${megabytes(picked.size)} MB; this build reads images up to ` +
              `${megabytes(limit)} MB`,
          );
          return;
        }
        say(`Reading ${picked.name} (${megabytes(picked.size)} MB)…`);
        let bytes;
        try {
          bytes = new Uint8Array(await picked.arrayBuffer());
        } catch (error) {
          say(`Could not read ${picked.name}: ${error}`);
          return;
        }
        if (await startImage(bytes, picked.name)) {
          await keepForNextVisit(picked);
          sessionStorage.setItem(RELOAD_KEY, "1");
          location.reload();
        }
      } finally {
        installing = false;
      }
    }

    async function restore() {
      if (installing || booted) {
        return;
      }
      installing = true;
      try {
        let cached;
        try {
          cached = await readCached();
        } catch (error) {
          console.warn("ClearSleeper: could not read the saved disc image", error);
          return;
        }
        if (!cached) {
          return;
        }
        const label = cached.name || "saved disc image";
        const bindings = await bindingsReady();
        const limit = imageLimit(bindings);
        if (cached.size > limit) {
          await clearCached();
          say(`${label} is ${megabytes(cached.size)} MB; choose a smaller image`);
          return;
        }
        say(`Reading ${label} (${megabytes(cached.size)} MB)…`);
        let bytes;
        try {
          bytes = new Uint8Array(await cached.arrayBuffer());
        } catch (error) {
          await clearCached();
          say(`Could not read the saved image: ${error}. Choose the file again.`);
          return;
        }
        if (!(await startImage(bytes, label))) {
          await clearCached();
          say("The saved disc image could not be used. Choose the file again.");
          return;
        }
        await startShell();
      } finally {
        installing = false;
        if (!booted) {
          startShell();
        }
      }
    }

    addEventListener("dragenter", (event) => {
      event.preventDefault();
      say("Release to install the disc image…");
    });
    addEventListener("dragover", (event) => {
      event.preventDefault();
      say("Release to install the disc image…");
    });
    addEventListener("dragleave", () => say(hint));
    addEventListener("drop", (event) => {
      event.preventDefault();
      const picked = event.dataTransfer?.files?.[0];
      if (picked) {
        install(picked);
      } else {
        say(hint);
      }
    });
    file.addEventListener("change", () => {
      const picked = file.files?.[0];
      if (picked) {
        install(picked);
      }
    });

    // The web build logs the frame's input to the console (the wasm side calls this), so a
    // session can be read back or replayed the way the desktop build's log file is.
    window.clearsleeperLog = (text) => console.log(text);

    async function startup() {
      say(hint);
      if (sessionStorage.getItem(RELOAD_KEY) === "1") {
        sessionStorage.removeItem(RELOAD_KEY);
        say("Restoring the saved disc image…");
        await restore();
        return;
      }
      await startShell();
      // A return visit should not need another drop: a saved image is restored in the fresh
      // instance the reload creates, after the native start screen has already appeared.
      let cached = null;
      try {
        cached = await readCached();
      } catch (error) {
        console.warn("ClearSleeper: could not read the saved disc image", error);
      }
      if (cached) {
        sessionStorage.setItem(RELOAD_KEY, "1");
        location.reload();
      }
    }
    startup();
  </script>
</body>

</html>
