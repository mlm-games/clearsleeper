[package]
name = "clearsleeper"
version = "0.1.0"
edition = "2024"
description = "The Wind Waker recreation on repame + repose (no bevy)"

[dependencies]
repame-sim = "0.3"
repame-shell = "0.3"
repame-input = "0.3"
repame-audio = "0.3"
repame-view3d = "0.3.4"
repose-core = "0.31"
repose-ui = "0.31"
repose-render-wgpu = "0.31"
repose-text = "0.31"
bevy_ecs = "0.19"
glam = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
winit = "0.30"
rlobkit-app-events = { version = "0.5", features = ["jni-bridge"] }

[lib]
name = "clearsleeper"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "clearsleeper"
path = "src/main.rs"

[package.metadata.android]
package = "org.mlm.clearsleeper"
apk_name = "cs"
build_targets = ["aarch64-linux-android"]
assets = "packaging/assets"

[package.metadata.android.application]
label = "ClearSleeper"

[package.metadata.android.application.activity]
name = "rust.rlobkit.RlobKitMainActivity"
exported = true
launch_mode = "singleTask"

[package.metadata.android.application.activity.intent_filter]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[profile.dev]
opt-level = 1
